<style>
:root {
  --bg: #F4F6F8; --surface: #fff; --head: #FAFBFC; --line: #D8DFE6; --line-soft: #EDF0F3;
  --text: #16222E; --text2: #4E5D6C; --muted: #7C8B99; --faint: #AEBAC5;
  --accent: #1B5C99; --accent-dark: #14487A; --accent-soft: #E8F1FA; --nav: #14222F; --nav-text: #A8B7C4; --nav-hi: #7FB4DE;
  --hl: #FBE6A6; --ok: #2E9E55; --warn: #E0A21B;
  --shadow: 0 24px 60px rgba(20, 34, 47, .18);
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --mono: "IBM Plex Mono", Consolas, ui-monospace, monospace;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }
svg { display: block; }
.wrap { width: min(1180px, 100% - 40px); margin: 0 auto; }
mark { background: var(--hl); color: inherit; border-radius: 2px; padding: 0 1px; }
.mono { font-family: var(--mono); }

/* ---- header: brand, site search, language ---- */
.top { position: sticky; top: 0; z-index: 20; background: rgba(255, 255, 255, .86); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
.brand svg { width: 34px; height: 34px; }
.find { position: relative; flex: 1; max-width: 480px; }
.find label { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; transition: border-color .15s, box-shadow .15s; }
.find label:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(27, 92, 153, .14); }
.find svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.find input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: 15px var(--sans); color: var(--text); }
.find input::placeholder { color: var(--faint); }
.find .n { font: 600 12px var(--mono); color: var(--accent); white-space: nowrap; }
.found { position: absolute; left: 0; right: 0; top: calc(100% + 8px); display: none; flex-direction: column; gap: 6px; padding: 8px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); max-height: min(70vh, 520px); overflow: auto; }
.found.on { display: flex; }
.found a { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 9px 10px; border-radius: 8px; border: 1px solid transparent; }
.found a:hover, .found a.cur { background: var(--accent-soft); border-color: #C7DCF0; }
.found a svg { width: 30px; height: 30px; }
.found a b { display: block; font-size: 14px; }
.found a span { display: block; font-size: 13px; color: var(--text2); line-height: 1.4; }
.found a small { font: 500 11px var(--mono); color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
.found .none { padding: 12px; color: var(--muted); font-size: 14px; text-align: center; }
.top nav { display: flex; gap: 2px; margin-left: auto; }
.top nav a { padding: 8px 10px; border-radius: 8px; font-weight: 500; font-size: 14px; color: var(--text2); white-space: nowrap; }
.top nav a:hover { background: var(--line-soft); color: var(--text); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-weight: 600; font-size: 15px; transition: transform .15s, box-shadow .15s; white-space: nowrap; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(20, 34, 47, .12); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn svg { width: 16px; height: 16px; }
.lang { position: relative; }
.lang summary { list-style: none; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; font-weight: 600; font-size: 13px; }
.lang summary::-webkit-details-marker { display: none; }
.lang summary svg { width: 16px; height: 16px; color: var(--muted); }
.lang div { position: absolute; right: 0; top: calc(100% + 6px); display: flex; flex-direction: column; min-width: 150px; padding: 6px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.lang button { text-align: left; padding: 8px 10px; border: 0; border-radius: 7px; background: none; font-size: 14px; }
.lang button:hover { background: var(--line-soft); }
.lang button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* ---- hero ---- */
.hero { position: relative; overflow: hidden; background: radial-gradient(1200px 500px at 70% -10%, #1F6AAE 0%, var(--nav) 55%, #0E1820 100%); color: #fff; padding: 64px 0 90px; }
.hero::after { content: ""; position: absolute; inset: auto 0 0; height: 90px; background: linear-gradient(transparent, var(--bg)); }
.hero .wrap { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; gap: 44px; align-items: center; position: relative; z-index: 1; }
.hero h1 { margin: 0 0 8px; font-size: 54px; line-height: 1.04; letter-spacing: -.03em; }
.hero h1 span { color: var(--nav-hi); }
.hero .tag { font: 500 13px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--nav-hi); margin-bottom: 18px; }
.hero .lead { font-size: 18.5px; line-height: 1.5; color: #D5E0EA; margin: 0 0 26px; }
.hero .cta { display: flex; gap: 12px; flex-wrap: wrap; }
.hero .btn.ghost { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .22); color: #fff; }
.hero .meta { margin-top: 22px; display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--nav-text); }
.hero .meta b { color: #fff; font-weight: 600; }
.shot { background: #fff; border-radius: 14px; box-shadow: var(--shadow), 0 0 0 1px rgba(255, 255, 255, .1); overflow: hidden; color: var(--text); }
.shot svg, .typing svg { width: 100%; height: auto; font-family: var(--sans); }
.ap { opacity: 0; transform: translateY(6px); transition: opacity .35s ease, transform .35s ease; }
.ap.in { opacity: 1; transform: none; }
.ch { opacity: 0; transition: opacity .18s; }
.ch.in { opacity: 1; }
.caret { animation: blink 1s steps(1) infinite; }
.mk { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); transition: transform .3s ease; }
.mk.in { transform: none; }
.scene { opacity: 0; transition: opacity .5s; }
.scene.in { opacity: 1; }
.dim { transition: opacity .45s; }
.dim.off { opacity: .22; }
.bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); transition: transform .5s ease; }
.bar.in { transform: none; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .ap, .mk, .scene, .ch, .dim, .bar { transition: none; } .caret { animation: none; } }

/* ---- sections ---- */
section { padding: 72px 0; }
.sec-h { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.sec-h svg { width: 26px; height: 26px; color: var(--accent); }
.sec-h h2 { margin: 0; font-size: 32px; letter-spacing: -.02em; }
.sec-p { margin: 0 0 32px; color: var(--text2); font-size: 17px; max-width: 760px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.step .num { font: 600 12px var(--mono); color: var(--accent); letter-spacing: .1em; }
.step h3 { margin: 6px 0 6px; font-size: 19px; }
.step p { margin: 0 0 14px; color: var(--text2); font-size: 14.5px; }
.step svg { width: 100%; height: auto; border-radius: 10px; background: var(--head); border: 1px solid var(--line-soft); font-family: var(--sans); }
.typing { margin-top: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px 22px 8px; }
.typing h3 { margin: 0 0 4px; font-size: 20px; }
.typing p { margin: 0 0 10px; color: var(--text2); font-size: 14.5px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 20px 18px; scroll-margin-top: 90px; transition: transform .18s, box-shadow .18s, border-color .18s; }
.card:hover { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(20, 34, 47, .1); border-color: #C7D5E2; }
.card.flash { animation: flash 1.6s ease; }
@keyframes flash { 0%, 60% { box-shadow: 0 0 0 4px rgba(27, 92, 153, .35); } 100% { box-shadow: none; } }
.card .ic { width: 44px; height: 44px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin-bottom: 14px; }
.card .ic svg { width: 24px; height: 24px; }
.card h3 { margin: 0 0 6px; font-size: 17px; }
.card p { margin: 0; color: var(--text2); font-size: 14.5px; line-height: 1.5; }
.card .ex { margin-top: 12px; font: 12.5px var(--mono); color: var(--text2); background: var(--head); border: 1px solid var(--line-soft); border-radius: 8px; padding: 8px 10px; }
.types { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.tg { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--tc, var(--accent)); border-radius: 12px; padding: 14px 16px; }
.tg b { display: block; font-size: 14px; margin-bottom: 8px; }
.tg span { display: inline-block; margin: 0 6px 6px 0; font: 600 11.5px var(--mono); padding: 2px 7px; border-radius: 5px; background: color-mix(in srgb, var(--tc) 14%, #fff); color: color-mix(in srgb, var(--tc) 75%, #000); }
.dl { background: var(--nav); color: #fff; border-radius: 20px; padding: 44px; display: grid; grid-template-columns: 1fr auto; gap: 30px; align-items: center; }
.dl h2 { margin: 0 0 8px; font-size: 30px; }
.dl p { margin: 0; color: var(--nav-text); max-width: 620px; }
.dl .req { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--nav-text); }
.dl .req b { color: #fff; font-weight: 600; }
.dl .btns { display: flex; flex-direction: column; gap: 10px; }
.dl .btn { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .22); color: #fff; justify-content: flex-start; min-width: 230px; }
.dl .btn.primary { background: var(--nav-hi); border-color: var(--nav-hi); color: var(--nav); }
.dl .btn small { font-weight: 400; color: inherit; opacity: .75; margin-left: auto; font-size: 12.5px; }
footer { padding: 30px 0 40px; color: var(--muted); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
@media (max-width: 960px) {
  .hero .wrap { grid-template-columns: 1fr; }
  .hero h1 { font-size: 44px; }
  .steps, .grid { grid-template-columns: 1fr 1fr; }
  .top nav { display: none; }
  .dl { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .steps, .grid { grid-template-columns: 1fr; }
  .top .wrap { gap: 8px; }
  .brand span, .top .btn.primary span { display: none; }
  .hero { padding: 48px 0 70px; }
}
</style>

  en: ['ankara', ['Ankara office · budget-2026.xlsx', 'Anchor bolts order.pdf', 'Antalya travel plan.pdf', 'Analysis report Q3.docx', 'Annual survey.csv', 'Ankara branch inventory.xlsx', 'Android build notes.txt', 'Ankara suppliers.txt'], [412908, 61220, 3104, 1290, 1217, 1214]],
  de: ['ankara', ['Ankara Büro · Budget-2026.xlsx', 'Ankerbolzen Bestellung.pdf', 'Antalya Reiseplan.pdf', 'Analysebericht Q3.docx', 'Anfrage Kunden.csv', 'Ankara Filiale Inventar.xlsx', 'Anleitung Montage.txt', 'Ankara Lieferanten.txt'], [412908, 61220, 3104, 1290, 1217, 1214]],
  zh: ['安卡拉', ['安卡拉办事处 · 预算-2026.xlsx', '安装说明.txt', '安全检查表.docx', '安卡拉分公司库存.xlsx', '安排会议.docx', '安卡拉供应商.txt', '安徽项目.pdf', '安卡拉差旅.pdf'], [9812, 1106, 1071]],
  ru: ['анкара', ['Анкара офис · бюджет-2026.xlsx', 'Анкета сотрудника.pdf', 'Анталья план поездки.pdf', 'Анализ отчёт Q3.docx', 'Анонс мероприятий.csv', 'Анкара филиал инвентарь.xlsx', 'Андроид сборка.txt', 'Анкара поставщики.txt'], [412908, 61220, 3104, 1290, 1217, 1214]],

const fold = s => s.toLocaleLowerCase(LANG === 'tr' ? 'tr' : 'en').replace(/i̇/g, 'i').replace(/[ıi]/g, 'i').replace(/ş/g, 's').replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ö/g, 'o').replace(/ç/g, 'c').replace(/ё/g, 'е');
let tyTimers = [];
function drawTyping() {
  const [word, rows, counts] = TY[LANG], L = [...word].length, box = document.getElementById('typing');
  const match = r => { const f = fold(r), w = [...fold(word)]; let k = 0; while (k < w.length && f.startsWith(w.slice(0, k + 1).join(''))) k++; return k; };
  const cw = LANG === 'zh' ? 20 : 11.5, mono = 'IBM Plex Mono, Consolas, monospace';
  const html = `<svg viewBox="0 0 1180 400" role="img">
    <rect x="0" y="0" width="1180" height="400" fill="#FAFBFC" rx="12"/>
    <rect x="24" y="24" width="520" height="48" rx="10" fill="#fff" stroke="#1B5C99" stroke-width="1.5"/><use href="#i-search" x="40" y="39" width="18" height="18" color="#7C8B99"/>
    ${[...word].map((c, i) => `<text class="ch ty" data-k="${i + 1}" x="${66 + i * cw}" y="55" font-family="${mono}" font-size="20" fill="#16222E">${esc(c)}</text>`).join('')}
    <rect class="caret" id="tyCaret" x="66" y="34" width="1.6" height="28" fill="#1B5C99"/>
    <text x="560" y="44" font-size="11" font-weight="700" letter-spacing=".8" fill="#7C8B99">${esc(T('eşleşme').toUpperCase())}</text>
    ${counts.map((n, i) => { const w = 430 * Math.log10(n) / Math.log10(counts[0]); return `<g class="ty-b" data-k="${i + 1}" style="opacity:0"><text x="560" y="${72 + i * 22}" font-family="${mono}" font-size="12" font-weight="600" fill="#16222E">${esc([...word].slice(0, i + 1).join(''))}</text><rect class="bar" x="640" y="${62 + i * 22}" width="${w}" height="14" rx="3" fill="#1B5C99" opacity="${.35 + .65 * i / (counts.length - 1)}"/><text x="${648 + w}" y="${73 + i * 22}" font-family="${mono}" font-size="11.5" fill="#4E5D6C">${num(n)}</text></g>`; }).join('')}
    ${rows.map((r, i) => { const k = match(r), y = 104 + i * 36; return `<g class="dim" data-m="${k}"><rect x="24" y="${y - 2}" width="520" height="32" rx="6" fill="${i % 2 ? '#fff' : '#F4F6F8'}"/><use href="#i-file" x="34" y="${y + 6}" width="16" height="16" color="${r.endsWith('xlsx') || r.endsWith('csv') ? '#2E7D4A' : r.endsWith('pdf') ? '#B23B3B' : r.endsWith('docx') ? '#1B5C99' : '#4E5D6C'}"/><rect class="mk ty-m" x="58" y="${y + 6}" width="0" height="19" rx="3" fill="#FBE6A6"/><text x="60" y="${y + 20}" font-size="13.5" fill="#16222E">${[...r].map(c => `<tspan class="tc">${esc(c)}</tspan>`).join('')}</text></g>`; }).join('')}
    <text x="24" y="388" font-size="11.5" fill="#7C8B99" id="tyNote"></text></svg>`;
  box.innerHTML = html;
  const svg = box.firstElementChild, letters = [...svg.querySelectorAll('.ty')], bars = [...svg.querySelectorAll('.ty-b')], dims = [...svg.querySelectorAll('.dim')], caret = svg.querySelector('#tyCaret');
  const widths = dims.map(g => { let acc = 0; return [...g.querySelectorAll('.tc')].map(t => (acc += t.getComputedTextLength())); });
  const step = k => {
    letters.forEach(l => l.classList.toggle('in', +l.dataset.k <= k));
    caret.setAttribute('x', 66 + k * cw);
    bars.forEach(b => { const on = +b.dataset.k <= k; b.style.opacity = on ? 1 : 0; b.querySelector('.bar').classList.toggle('in', on); });
    dims.forEach((g, i) => { const m = Math.min(+g.dataset.m, k), ok = +g.dataset.m >= k; g.classList.toggle('off', !ok); const mk = g.querySelector('.ty-m'); mk.setAttribute('width', m ? widths[i][m - 1] + 4 : 0); mk.classList.toggle('in', m > 0 && ok); g.querySelectorAll('.tc').forEach((t, j) => t.setAttribute('font-weight', j < m && ok ? 700 : 400)); });
    svg.querySelector('#tyNote').textContent = k ? `${[...word].slice(0, k).join('')} → ${TF('{0} eşleşme · {1} ms', num(counts[k - 1]), 4 + k * 3)}` : '';
  };
  tyTimers.forEach(clearTimeout); tyTimers = [];
  const run = () => { step(0); for (let k = 1; k <= L; k++) tyTimers.push(setTimeout(() => step(k), 700 + k * 900)); tyTimers.push(setTimeout(run, 700 + L * 900 + 3200)); };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) step(L); else run();
}

    <rect x="174" y="20" width="126" height="48" rx="4" fill="#3D7BB5" opacity=".85"/><text x="182" y="38" font-size="11" font-weight="700" fill="#fff">${T('Projeler')}</text><text x="182" y="54" font-size="10" fill="#D5E0EA">2,2 GB</text>
    <rect x="174" y="72" width="60" height="28" rx="4" fill="#7FB4DE"/><text x="180" y="90" font-size="10" font-weight="600" fill="#14222F">${T('Fotoğraf')}</text>
    <rect x="238" y="72" width="62" height="28" rx="4" fill="#A8C8E6"/><text x="244" y="90" font-size="10" font-weight="600" fill="#14222F">${T('Arşiv')}</text>
    <rect x="20" y="104" width="100" height="46" rx="4" fill="#5A93C6" opacity=".85"/><text x="28" y="122" font-size="11" font-weight="700" fill="#fff">${T('Raporlar')}</text>
    <rect x="124" y="104" width="46" height="46" rx="4" fill="#AEBAC5"/><text x="147" y="134" text-anchor="middle" font-size="9" font-weight="600" fill="#14222F">${T('Geçici')}</text><line x1="128" y1="108" x2="166" y2="146" stroke="#B23B3B" stroke-width="1.5" opacity=".6"/><line x1="166" y1="108" x2="128" y2="146" stroke="#B23B3B" stroke-width="1.5" opacity=".6"/>

    ${[[154, 26], [284, 26], [104, 110]].map(([x, y]) => `<rect x="${x}" y="${y}" width="10" height="10" rx="2" fill="#fff"/><path d="M${x + 2} ${y + 5}l2.5 2.5 4-5" fill="none" stroke="#1B5C99" stroke-width="1.6"/>`).join('')}<rect x="154" y="110" width="10" height="10" rx="2" fill="#fff" stroke="#B23B3B"/>`);
  st('st2', `<rect x="12" y="12" width="296" height="146" rx="8" fill="#fff" stroke="#D8DFE6"/>
    ${[0, 1, 2, 3].map(i => `<g><use href="#i-file" x="24" y="${22 + i * 30}" width="18" height="18" color="${['#2E7D4A', '#1B5C99', '#B23B3B', '#4E5D6C'][i]}"/><text x="46" y="${35 + i * 30}" font-size="10.5" fill="#4E5D6C">${['envanter.xlsx', 'rapor.docx', 'plan.pdf', 'notlar.txt'][i]}</text><path d="M128 ${31 + i * 30} h40" stroke="#D8DFE6" stroke-width="1.5" stroke-dasharray="3 3"><animate attributeName="stroke-dashoffset" from="12" to="0" dur="1s" repeatCount="indefinite"/></path></g>`).join('')}
    <rect x="176" y="20" width="116" height="110" rx="6" fill="#FAFBFC" stroke="#D8DFE6"/><text x="186" y="37" font-size="9.5" font-weight="700" letter-spacing=".8" fill="#7C8B99">${T('İNDEKS')}</text>
    ${[0, 1, 2, 3, 4].map(i => `<rect x="186" y="${46 + i * 16}" width="${[96, 72, 88, 60, 80][i]}" height="10" rx="2" fill="#1B5C99" opacity="${.35 + i * .13}"/>`).join('')}
    <text x="24" y="150" font-size="10.5" fill="#4E5D6C">${T('8 çekirdek · 14 sn · sıkıştırılmış, bloklu')}</text>`);
  const q = T('sunucu odası');
  st('st3', `<rect x="12" y="12" width="296" height="146" rx="8" fill="#fff" stroke="#D8DFE6"/>
    <rect x="22" y="20" width="276" height="26" rx="6" fill="#fff" stroke="#1B5C99"/><use href="#i-search" x="30" y="27" width="12" height="12" color="#7C8B99"/><text x="48" y="37" font-size="12" class="mono" fill="#16222E">${esc(q)}</text><rect x="${50 + [...q].length * (LANG === 'zh' ? 12 : 7.2)}" y="25" width="1.5" height="16" fill="#1B5C99"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
    ${[0, 1, 2, 3].map(i => `<g><rect x="22" y="${56 + i * 24}" width="170" height="22" fill="${i ? '#fff' : '#E8F1FA'}"/><rect x="28" y="${61 + i * 24}" width="24" height="12" rx="3" fill="${['#E3F3E8', '#E8F1FA', '#F8E1DF', '#EDF0F3'][i]}"/><text x="58" y="${71 + i * 24}" font-size="10" font-weight="600" fill="#16222E">${['envanter.xlsx', 'bakim.docx', 'plan.pdf', 'notlar.txt'][i]}</text><rect x="130" y="${60 + i * 24}" width="56" height="14" rx="3" fill="#FBE6A6"/><text x="133" y="${71 + i * 24}" font-size="10" font-weight="700" fill="#16222E">${esc([...q].slice(0, 9).join(''))}…</text></g>`).join('')}
    <rect x="200" y="56" width="98" height="94" rx="6" fill="#FAFBFC" stroke="#EDF0F3"/>${[0, 1, 2, 3, 4, 5].map(i => `<rect x="208" y="${64 + i * 14}" width="${[60, 82, 70, 84, 50, 76][i]}" height="7" rx="2" fill="${i === 2 ? '#FBE6A6' : '#D8DFE6'}"/>`).join('')}

// ---------- site search: cards for what matches ----------
const hl = (s, q) => { const f = fold(s); let out = '', i = 0; for (;;) { const j = f.indexOf(q, i); if (j < 0) return out + esc(s.slice(i)); out += esc(s.slice(i, j)) + '<mark>' + esc(s.slice(j, j + q.length)) + '</mark>'; i = j + q.length; } };
const find = document.getElementById('find'), found = document.getElementById('found'), findN = document.getElementById('findN');
let cur = -1;
function doFind() {
  const q = fold(find.value.trim());
  if (!q) { found.classList.remove('on'); findN.textContent = ''; return; }
  const hits = F.filter(f => fold(T(f.t) + ' ' + T(f.d) + ' ' + f.k).includes(q));
  const tp = TYPES.filter(([n, , xs]) => fold(T(n)).includes(q) || xs.some(x => x.includes(q)));
  findN.textContent = hits.length + tp.length ? TF('{0} sonuç', hits.length + tp.length) : '';
  found.innerHTML = (hits.map(f => `<a href="#f-${f.id}" data-go="f-${f.id}"><svg><use href="#${f.ic}"/></svg><div><small>${T('Özellik')}</small><b>${hl(T(f.t), q)}</b><span>${hl(T(f.d), q)}</span></div></a>`).join('') +
    tp.map(([n, c, xs]) => `<a href="#turler" data-go="turler"><svg style="color:${c}"><use href="#i-types"/></svg><div><small>${T('Dosya türü')}</small><b>${hl(T(n), q)}</b><span>${xs.map(x => hl('.' + x, q)).join(' · ')}</span></div></a>`).join('')) ||
    `<div class="none">${TF('“{0}” için sonuç yok. Deneyin: excel, ocr, joker, süzgeç, dışa aktar.', esc(find.value.trim()))}</div>`;
  found.classList.add('on'); cur = -1;
}
find.addEventListener('input', doFind);
find.addEventListener('focus', doFind);
document.addEventListener('click', e => { if (!e.target.closest('.find')) found.classList.remove('on'); if (!e.target.closest('.lang')) document.getElementById('lang').open = false; });
found.addEventListener('click', e => { const a = e.target.closest('[data-go]'); if (!a) return; found.classList.remove('on'); const el = document.getElementById(a.dataset.go); if (el && el.classList.contains('card')) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } });
find.addEventListener('keydown', e => {
  const as = [...found.querySelectorAll('[data-go]')];
  if (e.key === 'Escape') { find.value = ''; doFind(); find.blur(); }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); cur = (cur + (e.key === 'ArrowDown' ? 1 : -1) + as.length) % as.length; as.forEach((a, i) => a.classList.toggle('cur', i === cur)); as[cur] && as[cur].scrollIntoView({ block: 'nearest' }); }
  if (e.key === 'Enter' && as.length) (as[Math.max(cur, 0)]).click();
});

// ---------- render everything in the chosen language ----------
function render() {
  document.documentElement.lang = LANG;
  document.getElementById('langB').textContent = LANG.toUpperCase();
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === LANG));
  document.querySelectorAll('[data-i]').forEach(el => { const v = T(el.dataset.i); if (/<\w/.test(v)) el.innerHTML = v; else el.textContent = v; });
  document.querySelectorAll('[data-ip]').forEach(el => el.placeholder = T(el.dataset.ip));
  document.getElementById('cards').innerHTML = F.map(f => `<article class="card" id="f-${f.id}"><div class="ic"><svg><use href="#${f.ic}"/></svg></div><h3>${T(f.t)}</h3><p>${T(f.d)}</p>${f.ex ? `<div class="ex">${f.ex[LANG]}</div>` : ''}</article>`).join('');
  document.getElementById('types').innerHTML = TYPES.map(([n, c, xs]) => `<div class="tg" style="--tc:${c}"><b>${T(n)}</b>${xs.map(x => `<span>.${x}</span>`).join('')}</div>`).join('');
  document.getElementById('ver').textContent = VER;
  document.getElementById('dlWin').href = DL + 'digsearch-' + VER + '.exe'; document.getElementById('dlLin').href = DL + 'digsearch-' + VER + '-linux-amd64.tar.gz'; document.getElementById('dlMac').href = DL + 'digsearch-' + VER + '-macos-arm64.zip';
  drawShot(); drawSteps(); drawTyping();
  if (find.value) doFind();
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { LANG = b.dataset.l; try { localStorage.setItem('lang', LANG); } catch {} document.getElementById('lang').open = false; render(); });
try { const l = localStorage.getItem('lang') || (navigator.language || 'tr').slice(0, 2); if (LANGS.includes(l)) LANG = l; } catch {}
render();
if (document.fonts) document.fonts.ready.then(() => { fitMarks(document.getElementById('shot')); drawTyping(); });
</script>
